name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          { grep -E '^e: ' build.log | head -40; echo; grep -A 25 'What went wrong' build.log | head -40; } > errors.txt || true
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk ShearGenius-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShearGenius-${{ github.run_number }}
          path: ShearGenius-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ShearGenius-${{ github.run_number }}.apk
